<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Filter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      width: 250px;
      padding: 8px;
      margin-bottom: 10px;
      font-size: 16px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      padding: 8px;
      border-bottom: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h2>Search Filter Example</h2>

  <input type="text" id="search" placeholder="Search items..." />

  <ul id="list">
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>
    <li>Mango</li>
    <li>Cherry</li>
    <li>Pineapple</li>
    <li>Grapes</li>
  </ul>

  <script src="app.js"></script>
</body>
</html>
